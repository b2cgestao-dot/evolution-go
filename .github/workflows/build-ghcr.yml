name: build-ghcr
on:
  push:
    branches: ["voltz/**"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: VERSION=0.7.2-fix405
          tags: ghcr.io/b2cgestao-dot/evolution-go:0.7.2-fix405
          labels: org.opencontainers.image.source=https://github.com/b2cgestao-dot/evolution-go
